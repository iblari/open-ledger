name: Render og:video clips

# The branded loop (re-rendered each run, its numbers are live) and one clip
# per charted claim. Videos live on the `og-media` branch and are served by
# /og/v/[file] — kept off main so deploys stay small.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Max new claim clips this run"
        required: false
        default: "40"
  schedule:
    - cron: "17 * * * *"   # hourly: metric clips follow data releases the same hour

permissions:
  contents: write

concurrency:
  group: og-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check out og-media (or start it)
        run: |
          if git ls-remote --exit-code --heads origin og-media >/dev/null; then
            git clone --depth 1 --branch og-media "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" og-media
          else
            mkdir og-media && cd og-media && git init -q -b og-media && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
      - name: Install renderer
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Render
        run: node scripts/render-og-videos.mjs --site https://voteunbiased.org --out og-media --max "${{ github.event.inputs.max || '40' }}"
      - name: Publish to og-media
        run: |
          cd og-media
          git config user.name "og-video bot"; git config user.email "actions@github.com"
          git add -A v
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "og:video renders $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin og-media
